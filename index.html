            scada: {

    body {

    .font-mono-numbers {

      font-variant-numeric: tabular-nums;
    }

    /* ISA-18.2 Unacknowledged Alarm Flashing Standards */
    @keyframes flash-crit {
      0%, 100% {
        background-color: rgba(239, 68, 68, 0.32);
        border-color: #EF4444;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.45);
      }
      50% {
        background-color: rgba(239, 68, 68, 0.06);
        border-color: rgba(239, 68, 68, 0.3);
        box-shadow: none;
      }
    }

    @keyframes flash-high {
      0%, 100% {
        background-color: rgba(249, 115, 22, 0.32);
        border-color: #F97316;
        box-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
      }
      50% {
        background-color: rgba(249, 115, 22, 0.06);
        border-color: rgba(249, 115, 22, 0.3);
        box-shadow: none;
      }
    }

    @keyframes flash-med {
      0%, 100% {
        background-color: rgba(234, 179, 8, 0.28);
        border-color: #EAB308;
      }
      50% {
        background-color: rgba(234, 179, 8, 0.05);
        border-color: rgba(234, 179, 8, 0.3);
      }
    }

    @keyframes flash-low {
      0%, 100% {
        background-color: rgba(59, 130, 246, 0.28);
        border-color: #3B82F6;
      }
      50% {
        background-color: rgba(59, 130, 246, 0.05);
        border-color: rgba(59, 130, 246, 0.3);
      }
    }

    .alarm-unack-critical {
      animation: flash-crit 1.0s infinite;
    }
    .alarm-unack-high {
      animation: flash-high 1.2s infinite;
    }
    .alarm-unack-medium {
      animation: flash-med 1.4s infinite;
    }
    .alarm-unack-low {
      animation: flash-low 1.6s infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090D14;
    }
    ::-webkit-scrollbar-thumb {
      background: #273549;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3B4E68;
    }
  </style>
</head>

      // Web Audio API Horn Sound Synth
      const audioCtxRef = useRef(null);

      const playAlarmSound = useCallback((isCritical) => {
        if (audioMuted) return;
        try {
          if (!audioCtxRef.current) {
            const AudioClass = window.AudioContext || window.webkitAudioContext;
            audioCtxRef.current = new AudioClass();
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = isCritical ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(isCritical ? 880 : 660, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(isCritical ? 440 : 520, ctx.currentTime + 0.16);

          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + 0.21);
        } catch (e) {
          // Audio blocked until user clicks
        }
      }, [audioMuted]);

      useEffect(() => {
        const update = () => {
          const d = new Date();
          const p = (n) => n.toString().padStart(2, '0');
          setCurrentTime(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`);
        };
        update();
        const id = setInterval(update, 1000);
        return () => clearInterval(id);
      }, []);

      // Derived counts
      const unackCount = activeAlarms.filter(a => a.status === 'UNACK_ALARM').length;
      const criticalCount = activeAlarms.filter(a => a.priority === 'CRITICAL').length;
      const highCount = activeAlarms.filter(a => a.priority === 'HIGH').length;
      const medCount = activeAlarms.filter(a => a.priority === 'MEDIUM').length;
      const lowCount = activeAlarms.filter(a => a.priority === 'LOW').length;

      useEffect(() => {

          const timer = setInterval(() => {
            playAlarmSound(criticalCount > 0);
          }, 4500);
          return () => clearInterval(timer);
        }
      }, [unackCount, criticalCount, audioMuted, playAlarmSound]);

      // Acknowledge handler
      const handleAcknowledge = (alarmIds) => {
        const d = new Date();
        const p = (n) => n.toString().padStart(2, '0');
        const timeStr = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

          if (alarmIds.includes(a.id)) {
            return {
              ...a,
              status: 'ACK_ALARM',
              acknowledgedBy: 'Operator_John',
              acknowledgedAt: timeStr,
            };
          }
          return a;
        }));

        // Log audit event
        const newAudits = alarmIds.map(id => {
          const found = activeAlarms.find(a => a.id === id);
          return {
            id: 'EVT-ACK-' + Date.now() + '-' + Math.random().toString(36).substring(2, 5),

            category: 'Setpoint Change',
            userId: 'Operator_John',
            userRole: 'Operator',
            nodeAffected: found ? found.tagName : id,
            actionDetails: `Operator acknowledged ${found?.priority || ''} alarm on ${found?.tagName || id} (${found?.description || ''})`,

        });
        setSystemEvents(prev => [...newAudits, ...prev]);

        ];

        let index = 0;
        const interval = setInterval(() => {
          const item = candidates[index % candidates.length];
          index++;

          const d = new Date();
          const p = (n) => n.toString().padStart(2, '0');
          const timeStr = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

            status: 'UNACK_ALARM',

                <div className={`flex items-center space-x-1.5 px-2.5 py-1 border ${lowCount > 0 ? 'bg-blue-950/30 border-blue-700/50 text-blue-300' : 'bg-slate-900/50 border-slate-800 text-slate-400'}`}>

                <button
                  onClick={() => setAudioMuted(!audioMuted)}
                  className={`px-2.5 py-1 text-xs border transition-colors flex items-center space-x-1.5 font-medium ${
                    audioMuted 
                      ? 'bg-slate-800/80 border-slate-700 text-slate-400 hover:bg-slate-700' 
                      : 'bg-amber-950/50 border-amber-600 text-amber-300 hover:bg-amber-900/60'
                  }`}
                  title="Silence or Arm Audible Alarm Horn"
                >
                  <span>{audioMuted ? '🔕 HORN SILENCED' : '🔔 HORN ARMED'}</span>
                </button>

                <div className="bg-black/70 border border-slate-800 px-2.5 py-1 text-right font-mono-numbers">
                  <div className="text-[9px] text-slate-500 uppercase tracking-widest leading-none">PLANT TIME</div>
                  <div className="text-xs font-semibold text-slate-200 tracking-wide leading-tight">{currentTime || '2026-09-14 08:55:00'}</div>
                </div>

          <div className="flex flex-1 overflow-hidden">

            <aside className="w-64 bg-[#0A0E15] border-r border-slate-800 flex flex-col justify-between flex-shrink-0">

                  <div className="text-[11px] text-slate-400">
                    High-Performance HMI (Level 2)
                  </div>
                </div>

                <nav className="space-y-1 px-2">
                  {/* Tab 1 */}
                  <button
                    onClick={() => setCurrentTab('ACTIVE')}
                    className={`w-full text-left px-3 py-2.5 transition-all flex items-center justify-between border-l-2 ${
                      currentTab === 'ACTIVE'
                        ? 'bg-[#15202E] border-cyan-400 text-cyan-200'
                        : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'
                    }`}
                  >
                    <div className="flex items-center space-x-2.5">
                      <span className={currentTab === 'ACTIVE' ? 'text-cyan-400' : 'text-slate-500'}>⚡</span>
                      <div>
                        <div className="text-xs font-semibold tracking-wide">Active Alarms</div>
                        <div className="text-[10px] text-slate-400">Real-Time Grid &amp; Ack</div>
                      </div>
                    </div>
                    {unackCount > 0 ? (
                      <span className="text-[9px] font-mono font-bold px-1.5 py-0.5 border bg-red-950/80 text-red-300 border-red-700 animate-pulse">
                        {unackCount} UNACK

                        {activeAlarms.length}

                  {/* Tab 2 */}
                  <button
                    onClick={() => setCurrentTab('HISTORICAL')}
                    className={`w-full text-left px-3 py-2.5 transition-all flex items-center justify-between border-l-2 ${
                      currentTab === 'HISTORICAL'
                        ? 'bg-[#15202E] border-cyan-400 text-cyan-200'

                  >
                    <div className="flex items-center space-x-2.5">
                      <span className={currentTab === 'HISTORICAL' ? 'text-cyan-400' : 'text-slate-500'}>📊</span>
                      <div>
                        <div className="text-xs font-semibold tracking-wide">Historical Alarms</div>
                        <div className="text-[10px] text-slate-400">ISA-18.2 Analytics &amp; Pareto</div>
                      </div>
                    </div>
                  </button>

                  {/* Tab 3 */}
                  <button
                    onClick={() => setCurrentTab('EVENTS')}
                    className={`w-full text-left px-3 py-2.5 transition-all flex items-center justify-between border-l-2 ${
                      currentTab === 'EVENTS'
                        ? 'bg-[#15202E] border-cyan-400 text-cyan-200'
                        : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/80'

                  >
                    <div className="flex items-center space-x-2.5">
                      <span className={currentTab === 'EVENTS' ? 'text-cyan-400' : 'text-slate-500'}>📝</span>
                      <div>
                        <div className="text-xs font-semibold tracking-wide">System Event Log</div>
                        <div className="text-[10px] text-slate-400">Audit Trail &amp; Setpoints</div>
                      </div>
                    </div>
                    <span className="text-[9px] font-mono font-bold px-1.5 py-0.5 border bg-slate-800/90 text-slate-300 border-slate-700">
                      AUDIT
                    </span>
                  </button>
                </nav>
              </div>

              {/* Sidebar Footer Metadata */}
              <div className="p-3 border-t border-slate-800 bg-[#080B10] text-[11px] space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-slate-400">PLANT STATE:</span>
                  <span className="inline-flex items-center px-1.5 py-0.5 bg-emerald-950/70 border border-emerald-700 text-emerald-300 text-[10px] font-bold font-mono">
                    STEADY STATE
                  </span>
                </div>
                <div className="flex items-center justify-between">
                  <span className="text-slate-400">ACTIVE SHIFT:</span>
                  <span className="text-slate-300 font-mono">Shift B (Day)</span>
                </div>
                <div className="flex items-center justify-between">
                  <span className="text-slate-400">OPERATOR:</span>
                  <span className="text-slate-300 font-mono">Op_John [402]</span>
                </div>
                <div className="pt-2 border-t border-slate-800/80 text-[10px] text-slate-400 leading-tight">
                  Standard: ANSI/ISA-18.2-2016<br />
                  Buffer Mode: Redis In-Memory Ring
                </div>
              </div>
            </aside>

            {/* Main Center Area */}
            <main className="flex-1 p-4 overflow-y-auto bg-[#0E131C] space-y-4">
              {currentTab === 'ACTIVE' && (
                <ActiveAlarmsView
                  alarms={activeAlarms}

              {currentTab === 'HISTORICAL' && (
                <HistoricalAlarmsView
                  historicalAlarms={historicalAlarms}
                  unackCount={unackCount}

              {currentTab === 'EVENTS' && (
                <EventLogView

          </div>

          {/* 3. Bottom Status Bar */}
          <footer className="bg-[#090D14] border-t border-slate-800/90 px-4 py-1.5 flex flex-wrap items-center justify-between text-[11px] font-mono text-slate-400">
            <div className="flex items-center space-x-4">
              <span className="flex items-center space-x-1.5">
                <span className="w-2 h-2 bg-emerald-400 rounded-full"></span>
                <span className="text-slate-300">SCADA PROTOCOL: OPC-UA over TLS 1.3</span>
              </span>
              <span className="hidden sm:inline text-slate-600">|</span>
              <span className="hidden sm:inline">Buffer Engine: Redis v7.2-Cluster</span>

              <span className="hidden sm:inline">Frame Drop Rate: 0.00%</span>

            <div className="flex items-center space-x-3">
              <span>ANSI/ISA-18.2-2016 State: <strong className="text-cyan-300">COMPLIANT</strong></span>

    // --- TAB 1: ACTIVE ALARMS VIEW ---
    function ActiveAlarmsView({ alarms, onAcknowledge }) {
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [priorityFilter, setPriorityFilter] = useState('ALL');
      const [unackOnly, setUnackOnly] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      const totalActive = alarms.length;
      const unackCount = alarms.filter(a => a.status === 'UNACK_ALARM').length;
      const criticalCount = alarms.filter(a => a.priority === 'CRITICAL').length;
      const highCount = alarms.filter(a => a.priority === 'HIGH').length;

      const filteredAlarms = useMemo(() => {
        return alarms.filter(a => {
          if (priorityFilter !== 'ALL' && a.priority !== priorityFilter) return false;
          if (unackOnly && a.status !== 'UNACK_ALARM') return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return (
              a.tagName.toLowerCase().includes(q) ||
              a.description.toLowerCase().includes(q) ||
              a.node.toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [alarms, priorityFilter, unackOnly, searchQuery]);

      const handleSelectAll = (e) => {
        if (e.target.checked) {
          setSelectedIds(new Set(filteredAlarms.map(a => a.id)));
        } else {
          setSelectedIds(new Set());
        }
      };

      const handleSelectRow = (id) => {
        const next = new Set(selectedIds);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        setSelectedIds(next);
      };

      const handleBulkAck = () => {
        if (selectedIds.size === 0) return;
        onAcknowledge(Array.from(selectedIds));
        setSelectedIds(new Set());
      };

      const renderPriorityBadge = (priority) => {
        switch (priority) {
          case 'CRITICAL':
            return (
              <span className="inline-flex items-center space-x-1.5 px-2 py-0.5 bg-red-950/70 border border-red-600 text-red-300 text-xs font-bold font-mono">
                <span className="w-2 h-2 bg-red-600 rotate-45 inline-block"></span>
                <span>CRITICAL</span>
              </span>
            );
          case 'HIGH':
            return (
              <span className="inline-flex items-center space-x-1.5 px-2 py-0.5 bg-orange-950/70 border border-orange-500 text-orange-300 text-xs font-bold font-mono">
                <span className="w-2 h-2 bg-orange-500 inline-block"></span>
                <span>HIGH</span>
              </span>
            );
          case 'MEDIUM':
            return (
              <span className="inline-flex items-center space-x-1.5 px-2 py-0.5 bg-yellow-950/60 border border-yellow-500 text-yellow-300 text-xs font-semibold font-mono">
                <span className="w-2 h-2 rounded-full bg-yellow-400 inline-block"></span>
                <span>MEDIUM</span>
              </span>
            );
          case 'LOW':
            return (
              <span className="inline-flex items-center space-x-1.5 px-2 py-0.5 bg-blue-950/60 border border-blue-500 text-blue-300 text-xs font-medium font-mono">
                <span className="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-t-[6px] border-t-blue-400 inline-block"></span>
                <span>LOW</span>
              </span>
            );
          default:
            return null;
        }
      };

      return (
        <div className="space-y-4">
          {/* Header KPIs */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <div className="bg-[#121822] border border-slate-800 p-3 flex flex-col justify-between">
              <div className="flex items-center justify-between text-slate-400 text-xs uppercase tracking-wider font-semibold">
                <span>Total Active Alarms</span>
                <span className="text-slate-500 text-[11px] font-mono">PLC LIVE</span>
              </div>
              <div className="flex items-baseline space-x-2 mt-2">
                <span className="text-2xl font-bold font-mono-numbers text-slate-100">{totalActive}</span>
                <span className="text-xs text-slate-400">active states</span>
              </div>
              <div className="text-[11px] text-slate-500 mt-1">Buffered via Redis Stream #s7_live</div>
            </div>

            <div className={`border p-3 flex flex-col justify-between transition-all ${
              unackCount > 0 
                ? 'bg-red-950/30 border-red-700/80 shadow-[inset_0_0_12px_rgba(239,68,68,0.15)]' 
                : 'bg-[#121822] border-slate-800'
            }`}>
              <div className="flex items-center justify-between text-xs uppercase tracking-wider font-semibold">
                <span className={unackCount > 0 ? 'text-red-300' : 'text-slate-400'}>Unacknowledged Alarms</span>
                {unackCount > 0 && (
                  <span className="flex h-2 w-2 relative">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                  </span>
                )}
              </div>
              <div className="flex items-baseline space-x-2 mt-2">
                <span className={`text-2xl font-bold font-mono-numbers ${unackCount > 0 ? 'text-red-400' : 'text-slate-400'}`}>
                  {unackCount}
                </span>
                <span className="text-xs text-slate-400">require operator ack</span>
              </div>
              <div className="text-[11px] text-slate-500 mt-1">Requires physical/HMI acknowledgment</div>
            </div>

            <div className={`border p-3 flex flex-col justify-between ${
              criticalCount > 0 ? 'bg-[#1F1316] border-red-600/90' : 'bg-[#121822] border-slate-800'
            }`}>
              <div className="flex items-center justify-between text-xs uppercase tracking-wider font-semibold">
                <span className={criticalCount > 0 ? 'text-red-300' : 'text-slate-400'}>Critical Priority Alarms</span>
                <span className="text-[10px] font-mono px-1 py-0.5 bg-red-900/60 text-red-200 border border-red-700">ISA CAT 1</span>
              </div>
              <div className="flex items-baseline space-x-2 mt-2">
                <span className={`text-2xl font-bold font-mono-numbers ${criticalCount > 0 ? 'text-red-400' : 'text-slate-400'}`}>
                  {criticalCount}
                </span>
                <span className="text-xs text-slate-400">immediate risk</span>
              </div>
              <div className="text-[11px] text-slate-500 mt-1">High-risk trip or safety interlock</div>
            </div>

            <div className="bg-[#121822] border border-slate-800 p-3 flex flex-col justify-between">
              <div className="flex items-center justify-between text-slate-400 text-xs uppercase tracking-wider font-semibold">
                <span>High Priority Alarms</span>
                <span className="text-orange-400 text-[11px] font-mono">PRIORITY 2</span>
              </div>
              <div className="flex items-baseline space-x-2 mt-2">
                <span className="text-2xl font-bold font-mono-numbers text-orange-300">{highCount}</span>
                <span className="text-xs text-slate-400">equipment limit warning</span>
              </div>
              <div className="text-[11px] text-slate-500 mt-1">Target Ack time: &lt; 5 minutes</div>
            </div>
          </div>

          {/* Action Toolbar */}
          <div className="bg-[#121822] border border-slate-800 p-2.5 flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <div className="flex items-center border border-slate-800 bg-[#0C1017] p-0.5 text-xs">
                {['ALL', 'CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].map(p => (
                  <button
                    key={p}
                    onClick={() => setPriorityFilter(p)}
                    className={`px-2 py-1 text-[11px] font-mono transition-colors ${
                      priorityFilter === p ? 'bg-slate-700 text-cyan-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {p}
                  </button>
                ))}
              </div>

              <button
                onClick={() => setUnackOnly(!unackOnly)}
                className={`px-2.5 py-1 text-xs font-mono border transition-colors flex items-center space-x-1.5 ${
                  unackOnly ? 'bg-red-950/70 border-red-600 text-red-300' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className={`w-2 h-2 ${unackOnly ? 'bg-red-500' : 'bg-slate-600'}`}></span>
                <span>UNACK ONLY ({unackCount})</span>
              </button>

              <div className="relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search Tag, Node, Fault..."
                  className="bg-[#0C1017] border border-slate-800 text-xs px-2.5 py-1 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 w-52 font-mono"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">×</button>
                )}
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-xs text-slate-400 font-mono-numbers">
                Selected: <strong className="text-cyan-300">{selectedIds.size}</strong> of {filteredAlarms.length}
              </span>
              <button
                onClick={handleBulkAck}
                disabled={selectedIds.size === 0}
                className={`px-3 py-1 text-xs font-semibold tracking-wider uppercase border transition-colors flex items-center space-x-1.5 ${
                  selectedIds.size > 0
                    ? 'bg-cyan-900/50 border-cyan-500 text-cyan-200 hover:bg-cyan-800/60 shadow-[0_0_8px_rgba(6,182,212,0.2)]'
                    : 'bg-slate-900/60 border-slate-800 text-slate-600 cursor-not-allowed'
                }`}
              >
                <span>✓ Acknowledge Selected</span>
              </button>
            </div>
          </div>

          {/* Data Table */}
          <div className="bg-[#121822] border border-slate-800 overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-[#0D131C] border-b border-slate-800 text-slate-400 uppercase tracking-wider font-semibold font-mono text-[11px]">
                  <th className="p-2.5 w-10 text-center">
                    <input
                      type="checkbox"
                      checked={filteredAlarms.length > 0 && selectedIds.size === filteredAlarms.length}
                      onChange={handleSelectAll}
                      className="rounded-none bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer"
                    />
                  </th>
                  <th className="p-2.5 w-40">Timestamp</th>
                  <th className="p-2.5 w-28">Priority</th>
                  <th className="p-2.5 w-36">Tag Name / Node</th>
                  <th className="p-2.5">Fault Description</th>
                  <th className="p-2.5 w-32 font-mono-numbers">Value / Limit</th>
                  <th className="p-2.5 w-36">Status</th>
                  <th className="p-2.5 w-28 text-center">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/80">
                {filteredAlarms.length === 0 ? (
                  <tr>
                    <td colSpan="8" className="p-8 text-center text-slate-500 font-mono">
                      No active alarms match the current filter criteria.
                    </td>
                  </tr>
                ) : (
                  filteredAlarms.map((alarm) => {
                    const isSelected = selectedIds.has(alarm.id);
                    const isUnack = alarm.status === 'UNACK_ALARM';
                    
                    let unackClass = '';
                    if (isUnack) {
                      if (alarm.priority === 'CRITICAL') unackClass = 'alarm-unack-critical';
                      else if (alarm.priority === 'HIGH') unackClass = 'alarm-unack-high';
                      else if (alarm.priority === 'MEDIUM') unackClass = 'alarm-unack-medium';
                      else unackClass = 'alarm-unack-low';
                    }

                    return (
                      <tr
                        key={alarm.id}
                        className={`transition-colors ${
                          isSelected
                            ? 'bg-[#152336]'
                            : isUnack
                            ? 'bg-[#17151D] hover:bg-[#1E1926]'
                            : 'hover:bg-[#151D28]'
                        }`}
                      >
                        <td className="p-2.5 text-center">
                          <input
                            type="checkbox"
                            checked={isSelected}
                            onChange={() => handleSelectRow(alarm.id)}
                            className="rounded-none bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer"
                          />
                        </td>
                        <td className="p-2.5 font-mono-numbers text-slate-300 whitespace-nowrap">
                          {alarm.timestamp}
                        </td>
                        <td className="p-2.5">
                          {renderPriorityBadge(alarm.priority)}
                        </td>
                        <td className="p-2.5">
                          <div className="font-mono font-bold text-slate-100 tracking-wide">
                            {alarm.tagName}
                          </div>
                          <div className="text-[10px] text-slate-400 font-mono truncate max-w-[140px]" title={alarm.node}>
                            {alarm.node}
                          </div>
                        </td>
                        <td className="p-2.5 text-slate-200">
                          <div className="font-medium">{alarm.description}</div>
                          {alarm.acknowledgedBy && (

          </div>

          {/* Filter Toolbar */}
          <div className="bg-[#121822] border border-slate-800 p-2.5 flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-xs text-slate-400 font-semibold mr-1">Category:</span>
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-2 py-1 text-[11px] font-mono border transition-colors ${
                    selectedCategory === cat
                      ? 'bg-slate-700 border-slate-500 text-cyan-300 font-bold'
                      : 'bg-[#0C1017] border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="flex items-center space-x-2">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search User, Tag or Action..."
                className="bg-[#0C1017] border border-slate-800 text-xs px-2.5 py-1 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 w-56 font-mono"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="text-slate-400 hover:text-slate-200 text-xs">Clear</button>
              )}
            </div>
          </div>

          {/* Events Table */}
          <div className="bg-[#121822] border border-slate-800 overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-[#0D131C] border-b border-slate-800 text-slate-400 uppercase tracking-wider font-semibold font-mono text-[11px]">
                  <th className="p-2.5 w-44 font-mono-numbers">Timestamp</th>
                  <th className="p-2.5 w-44">Category</th>
                  <th className="p-2.5 w-44">User / Agent ID</th>
                  <th className="p-2.5 w-36">Node Affected</th>
                  <th className="p-2.5">Action Details &amp; State Change</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/80">
                {filteredEvents.length === 0 ? (
                  <tr>
                    <td colSpan="5" className="p-8 text-center text-slate-500 font-mono">
                      No events found matching current search or category filter.
                    </td>
                  </tr>
                ) : (
                  filteredEvents.map((evt) => (
                    <tr key={evt.id} className="hover:bg-[#151D28] transition-colors">
                      <td className="p-2.5 font-mono-numbers text-slate-300 whitespace-nowrap">
                        {evt.timestamp}
                      </td>
                      <td className="p-2.5 whitespace-nowrap">
                        {renderCategoryBadge(evt.category)}
                      </td>
                      <td className="p-2.5">
                        <div className="flex items-center space-x-2">
                          <span className="font-mono font-bold text-slate-200">{evt.userId}</span>
                          <span className={`text-[10px] font-mono px-1.5 py-0.5 border ${
                            evt.userRole === 'AI Agent' 
                              ? 'bg-purple-900/50 text-purple-200 border-purple-600' 
                              : 'bg-slate-900 text-slate-400 border-slate-800'
                          }`}>
                            {evt.userRole}
                          </span>
                        </div>
                      </td>
                      <td className="p-2.5 font-mono text-cyan-300">
                        {evt.nodeAffected || '-'}
                      </td>
                      <td className="p-2.5 text-slate-300">
                        <div>{evt.actionDetails}</div>
                        {(evt.previousValue || evt.newValue) && (
                          <div className="text-[11px] font-mono text-slate-400 mt-1 flex items-center space-x-2">
                            <span className="bg-slate-900 px-1 py-0.5 border border-slate-800 text-slate-400">
                              PREV: {evt.previousValue}
                            </span>
                            <span>→</span>
                            <span className="bg-slate-900 px-1 py-0.5 border border-cyan-800 text-cyan-300">
                              NEW: {evt.newValue}
                            </span>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>

          <div className="flex items-center justify-between text-[11px] text-slate-400 font-mono px-1">
            <span>Showing {filteredEvents.length} of {events.length} audit entries</span>
            <span>Cryptographically verified PLC &amp; SCADA telemetry log</span>
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IndustrialDashboard />);
  </script>
</body>
</html>
